name: Construire l'APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap add android

      - name: Permissions notifications Android
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Compiler l'APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Garder l'APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sweet-control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk \
            --target ${{ github.sha }} \
            --title "Sweet_Control (dernier APK)" \
            --notes "APK de test. Télécharge app-debug.apk et installe-le."
