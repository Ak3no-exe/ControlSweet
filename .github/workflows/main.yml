name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: |
          # Met de côté les fichiers du widget (le dossier android du dépôt)
          if [ -d android ]; then mv android widget_android; fi

          [ -f package.json ] || npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @capacitor/local-notifications@6 @capacitor/preferences@6

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.sweetcontrol.app","appName":"Sweet_Control","webDir":"www"}' > capacitor.config.json
          fi

          # Si ton index.html est à la racine et pas dans www/
          if [ ! -d www ]; then mkdir www && cp index.html www/index.html; fi

          npx cap add android

          # Remet les 3 fichiers du widget dans le nouveau projet
          W=widget_android/app/src/main
          N=android/app/src/main
          if [ -d "$W" ]; then
            mkdir -p $N/res/xml $N/res/layout $N/java/com/sweetcontrol/app
            cp $W/res/xml/sc_widget_info.xml $N/res/xml/
            cp $W/res/layout/sc_widget.xml $N/res/layout/
            cp $W/java/com/sweetcontrol/app/ScWidget.java $N/java/com/sweetcontrol/app/
          fi

          # Déclare le widget dans le manifest
          if ! grep -q ScWidget $N/AndroidManifest.xml; then
            sed -i 's#</application>#<receiver android:name=".ScWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/sc_widget_info"/></receiver></application>#' $N/AndroidManifest.xml
          fi

          npx cap sync android

      - name: Permissions notifications Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q POST_NOTIFICATIONS $M; then
            sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $M
          fi

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Garder l'APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sweet-control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
